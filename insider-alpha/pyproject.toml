[project]
name = "insider-alpha"
version = "0.1.0"
description = "Out-of-sample replication of opportunistic insider trading alpha (Cohen, Malloy & Pomorski 2012)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "requests>=2.31",
    "statsmodels>=0.14",
    "scipy>=1.12",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
